name: diag-v4

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Probar el reconocimiento de fechas
        run: |
          mkdir -p /tmp/parser
          javac -nowarn -encoding UTF-8 -d /tmp/parser \
            app/src/main/java/com/memoriavoz/app/ParserFechas.java \
            app/src/main/java/com/memoriavoz/app/Fechas.java \
            .github/pruebas/PruebaParser.java
          java -cp /tmp/parser PruebaParser

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/app-release.apk

  probar:
    needs: compilar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Habilitar emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Usar la app en Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 .github/pruebas/prueba_emulador.py app-release.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: capturas

  publicar:
    needs: probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv app-release.apk MemoriaDeVoz.apk
          gh release create "v${{ github.run_number }}" MemoriaDeVoz.apk \
            --title "Memoria de Voz ${{ github.run_number }}" \
            --notes "Descarga MemoriaDeVoz.apk en tu celular e instálalo encima de la versión anterior."
