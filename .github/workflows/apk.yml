name: Crear APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Probar el reconocimiento de fechas
        run: |
          mkdir -p /tmp/parser
          javac -nowarn -encoding UTF-8 -d /tmp/parser \
            app/src/main/java/com/memoriavoz/app/ParserFechas.java \
            app/src/main/java/com/memoriavoz/app/Fechas.java \
            .github/pruebas/PruebaParser.java
          java -cp /tmp/parser PruebaParser

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk MemoriaDeVoz.apk

      - name: Usar la app en un Android emulado
        run: |
          set +o pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          IMG="system-images;android-34;google_apis;x86_64"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install platform-tools emulator "$IMG" | tail -2
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force -n prueba -k "$IMG" -d pixel_6 2>&1 | tee avd.log
          emulator -list-avds | tee -a avd.log
          emulator -list-avds | grep -qx prueba
          nohup emulator -avd prueba -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot > emulador.log 2>&1 &
          timeout 300 adb wait-for-device
          for i in $(seq 1 120); do
            [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          adb shell getprop sys.boot_completed
          for a in window_animation_scale transition_animation_scale animator_duration_scale; do
            adb shell settings put global $a 0
          done
          sleep 20
          python3 .github/pruebas/prueba_emulador.py MemoriaDeVoz.apk

      - name: Guardar capturas de la prueba
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p capturas
          cp emulador.log avd.log capturas/ || true
          zip -qr capturas.zip capturas
          gh release create "pruebas-${{ github.run_id }}" capturas.zip --prerelease \
            --title "Pruebas ${{ github.run_number }}" --notes "Capturas de la prueba automatica."

      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" MemoriaDeVoz.apk \
            --title "Memoria de Voz ${{ github.run_number }}" \
            --notes "Descarga MemoriaDeVoz.apk en tu celular e instalalo encima de la version anterior."
