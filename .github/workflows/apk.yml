name: Crear APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk MemoriaDeVoz.apk
          gh release create "v${{ github.run_number }}" MemoriaDeVoz.apk \
            --title "Memoria de Voz ${{ github.run_number }}" \
            --notes "Descarga MemoriaDeVoz.apk en tu celular e instálalo."
